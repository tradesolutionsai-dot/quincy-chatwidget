<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Keyboard diagnostic</title>
<style>
  body{font-family:-apple-system,sans-serif;margin:0;padding:20px}
  .sp{height:1400px;background:repeating-linear-gradient(180deg,#f2f2f2,#f2f2f2 40px,#e6e6e6 40px,#e6e6e6 80px);border-radius:8px;margin-top:16px}
  .btn{position:fixed;bottom:20px;right:16px;width:60px;height:60px;border-radius:50%;background:#0a2a4a;color:#fff;border:0;font-size:22px;z-index:2147483000}
  .fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:2147483600;display:block}
</style></head>
<body>
<h2>Keyboard diagnostic host page</h2>
<p>Tap the blue button, then tap the input inside. Screenshot the numbers with the keyboard OPEN.</p>
<div class="sp"></div>
<button class="btn" id="b">💬</button>
<script>
var frame=null, pending=null;
function sync(){
  if(!frame||!window.visualViewport)return;
  if(pending)return;
  pending=requestAnimationFrame(function(){
    pending=null; if(!frame)return;
    var vv=window.visualViewport;
    frame.style.top=(vv.offsetTop||0)+'px';
    frame.style.left=(vv.offsetLeft||0)+'px';
    frame.style.width=vv.width+'px';
    frame.style.height=vv.height+'px';
    frame.style.bottom='auto'; frame.style.right='auto';
    post();
  });
}
function post(){
  if(!frame||!frame.contentWindow)return;
  var vv=window.visualViewport||{};
  var r=frame.getBoundingClientRect();
  frame.contentWindow.postMessage({
    diag:1,
    iH:window.innerHeight,
    vvH:vv.height!==undefined?Math.round(vv.height):'n/a',
    vvT:vv.offsetTop!==undefined?Math.round(vv.offsetTop):'n/a',
    vvPT:vv.pageTop!==undefined?Math.round(vv.pageTop):'n/a',
    sc:vv.scale!==undefined?vv.scale:'n/a',
    sy:Math.round(window.scrollY),
    sab:(function(){var d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;left:0;width:1px;height:env(safe-area-inset-bottom,0px);';document.body.appendChild(d);var v=Math.round(parseFloat(getComputedStyle(d).height)||0);d.remove();return v;})(),
    fB:Math.round(r.bottom),
    fT:Math.round(r.top),
    fH:Math.round(r.height),
    gap:(vv.height!==undefined)?Math.round(window.innerHeight-vv.height-(vv.offsetTop||0)):'n/a'
  },'*');
}
document.getElementById('b').addEventListener('click',function(){
  if(frame){frame.remove();frame=null;document.documentElement.style.overflow='';document.body.style.overflow='';return;}
  document.documentElement.style.overflow='hidden';
  document.body.style.overflow='hidden';
  frame=document.createElement('iframe');
  frame.className='fr';
  frame.src='diag-frame.html';
  document.body.appendChild(frame);
  window.scrollTo(0,0);
  frame.addEventListener('load',function(){sync();post();});
  sync();
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',sync);
  window.visualViewport.addEventListener('scroll',sync);
}
setInterval(post,300);
</script>
</body></html>
